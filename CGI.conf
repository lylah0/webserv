server {
	server_name CGI;
	listen 8080;
	host localhost;
	root websites/CGI_test;
	index index.html;
	client_max_body_size 1048576;
	error_page 500 /error/500.html;
	error_page 413 /error/413/html;
	error_page 405 /error/405/html;
	error_page 404 /error/404.html;
	error_page 403 /error/403/html;
	error_page 400 /error/400/html;
    location / {
        root websites/CGI_test;
        index index.html;
        allow_methods GET;
        autoindex off;
    }
    location /upload {
        root websites/CGI_test/upload;
        upload_store websites/CGI_test/upload;
        allow_methods POST;
    }
    location /deletable {
        root websites/CGI_test/deletable;
        allow_methods GET DELETE;
        autoindex on;
    }
    location /cgi-bin {
        root websites/CGI_test/cgi-bin;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        allow_methods GET POST;
    }
    location /js {
        root websites/CGI_test/js;
        allow_methods GET;
    }
    location /style.css {
        root websites/CGI_test;
        allow_methods GET;
    }
}
